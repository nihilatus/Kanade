; Kanade — ESP32-S3 native USB HID keyboard for Japanese input (romaji → PC Japanese IME)
; Board: ESP32-S3-DevKitC-1 N16R8 — use the USB (OTG) port for HID, not UART.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8: 16 MB flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; LittleFS uses the "spiffs" partition in that table. The factory chord table
; is compiled in, so a filesystem image does not need to be uploaded.
board_build.filesystem = littlefs

build_flags =
	-DBOARD_HAS_PSRAM
	; USB OTG (TinyUSB) on the "USB" connector — required for HID keyboard
	-DARDUINO_USB_MODE=0
	; Optional serial over the same OTG port for logs (disable if it fights the host)
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1

build_src_filter = +<*>

lib_ldf_mode = deep+
lib_deps = bblanchon/ArduinoJson@^7.4.2
extra_scripts =
	pre:tools/check_secrets_untracked.py
	pre:tools/prebuild_chord_map.py
	pre:tools/core_library_includes.py

; Host unit tests for chord_core. No Arduino, no flash.
; The pre script runs the shared recipe vectors through the Python parser.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<chord_core.cpp> +<host_layout.cpp> +<config_http.cpp> +<config_job.cpp> +<config_files.cpp>
build_flags = -std=gnu++17
extra_scripts = pre:tools/test_recipe_vectors.py
